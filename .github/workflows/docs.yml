name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: .
          package-manager: pnpm@11.24.0
          build-cmd: pnpm --filter hypospray-docs build
          out-dir: docs/dist
        env:
          SITE_URL: https://texel.github.io
          BASE_PATH: /hypospray

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
